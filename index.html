                        <span class="crumb-separator">/</span>
                        <strong id="view-breadcrumb">Security Overview</strong>
                    </div>
                </div>

                    <!-- Global Search trigger with ⌘K -->
                    <button type="button" class="global-search-trigger" id="global-search-trigger" aria-label="Open Command Palette">
                        <span>⌕</span>
                        <span>Search entities, alerts, IPs...</span>
                        <kbd>⌘ K</kbd>

                    <!-- User Profile Avatar -->
                    <div class="avatar" data-account-initial title="Signed in as Alex Vance">A</div>
