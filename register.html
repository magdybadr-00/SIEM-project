<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">
    <title>Request Clearance | OBSIDIAN SIEM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background:#090909;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <main style="background:rgba(18,18,18,0.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:12px;width:100%;max-width:440px;padding:36px;box-shadow:0 24px 60px rgba(0,0,0,0.8);">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
            <span class="brand-mark" style="width:30px;height:30px;font-size:14px;">◆</span>
            <span style="font-weight:700;font-size:15px;color:#f5f5f5;">OBSIDIAN <span>SIEM</span></span>
        </div>
        <div class="eyebrow">IDENTITY PROVISIONING</div>
        <h1 style="font-size:20px;font-weight:700;color:#f5f5f5;margin-bottom:8px;">Request Clearance</h1>
        <p style="font-size:12px;color:#a3a3a3;margin-bottom:20px;">Submit a clearance request to the SOC engineering team.</p>

        <div id="register-note" style="display:none;background:rgba(16,185,129,0.15);border:1px solid #10b981;color:#a7f3d0;padding:10px;border-radius:6px;font-size:12px;margin-bottom:16px;">
            Clearance request recorded for demonstration. Please sign in with one of the assigned demo accounts.
        </div>

        <form id="register-form">
            <div class="field" style="margin-bottom:12px;">
                <label for="req-name" style="font-size:11px;color:#737373;display:block;margin-bottom:4px;">Full Name</label>
                <input type="text" id="req-name" class="input-text" placeholder="e.g. Rachel Adams" required />
            </div>
            <div class="field" style="margin-bottom:12px;">
                <label for="req-email" style="font-size:11px;color:#737373;display:block;margin-bottom:4px;">Corporate Email</label>
                <input type="email" id="req-email" class="input-text" placeholder="name@obsidian.corp" required />
            </div>
            <div class="field" style="margin-bottom:20px;">
                <label for="req-role" style="font-size:11px;color:#737373;display:block;margin-bottom:4px;">Requested Role</label>
                <select id="req-role" class="select-dropdown" style="width:100%;">
                    <option value="analyst">Security Analyst (Tier 1/2 Triage)</option>
                    <option value="engineer">Security Engineer (Rules &amp; Pipelines)</option>
                    <option value="auditor">Read-Only Auditor (Compliance &amp; GRC)</option>
                </select>
            </div>
            <button type="submit" class="button button-primary" style="width:100%;height:38px;">
                Submit Access Request →
            </button>
        </form>

        <div style="margin-top:20px;text-align:center;font-size:11px;color:#737373;">
            Already have an account? <a href="login.html" class="text-button" style="color:#a3a3a3;">Return to Sign In</a>
        </div>
    </main>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('register-note').style.display = 'block';
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1800);
        });
    </script>
</body>
</html>
