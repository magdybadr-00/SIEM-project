<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06090e">
    <title>Access pending | SafeCyber</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body data-access="authenticated">
    <main class="auth-main access-page">
        <section class="access-card">
            <div class="access-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M2.5 12s3.2-6 9.5-6 9.5 6 9.5 6-3.2 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="3.2"/><circle class="brand-eye-pupil" cx="12" cy="12" r="1.15"/><path class="brand-eye-scan" d="M15.2 15.2 18 18"/></svg></span><span>SafeCyber</span></div>
            <div class="access-icon" aria-hidden="true">⌁</div>
            <div class="eyebrow">Account access</div>
            <h1>You're signed in</h1>
            <p>There isn't any content assigned to your account yet. Please contact your administrator if you need access to the security console.</p>
            <a class="button button-primary logout-link" href="login.html">Sign out</a>
        </section>
    </main>
    <script src="JS/main.js"></script>
</body>
</html>
